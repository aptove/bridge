[package]
name = "aptove-bridge-core"
version = "0.2.9"
edition = "2021"
authors = ["Saltuk Alakus <saltukalakus@gmail.com>"]
description = "Core library for the Aptove bridge"
repository = "https://github.com/aptove/bridge"
license = "MIT"
readme = "README.md"

[lib]
name = "bridge_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.29"
reqwest = { version = "0.13", features = ["json"] }
futures-util = "0.3"
tungstenite = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
qrcode = "0.14"
image = "0.25"
directories = "6.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
tokio-process = "0.2"
base64 = "0.22"
rand = "0.10"
local-ip-address = "0.6"
rcgen = "0.14"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.0"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
time = "0.3.36"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
toml = "1.1"
which = "7"
fs2 = "0.4"
keepawake = "0.5"
open = "5"
arboard = "3"
subtle = "2"

[dev-dependencies]
mockito = "1.2"
tempfile = "3.10"
